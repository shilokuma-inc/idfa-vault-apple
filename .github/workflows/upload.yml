name: Upload

# develop / release/** への push で Archive → Export → App Store Connect へアップロードする（iOS・macOS・visionOS）。
# 作業ブランチを TestFlight で確認したいときは、手動実行（workflow_dispatch）でそのブランチを選ぶ。
# 作業ブランチの push ごとに上げると、App Store Connect の 24 時間あたりのアップロード上限に当たるため自動では上げない。
on:
  push:
    branches:
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

# ブランチをまたいで run を 1 本ずつ流す。ビルド番号は build-number ジョブと Xcode が App Store Connect の最新ビルドを見て決めるため、
# develop と release/** の run が並ぶと同じ番号を選んで片方のアップロードが失敗する。直前に上げたビルドはすぐには
# 数えられず、同じプラットフォームのアップロードが続くと重ならなくても失敗する（LEARNINGS.md）ので、
# プラットフォームごとではなく run ごとに並べ、あいだに後の run の archive（数分）を挟む。
# 既定の待機は 1 本だけで、3 本目が来ると待機中の run が通知なく取り消されるため、queue: max で 100 本まで待たせる。
# アップロード途中でキャンセルすると App Store Connect 側に中途半端なビルドが残るため、
# 実行中のものは完了させる（queue: max は cancel-in-progress: true と組み合わせられない）
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  # ビルド番号（CFBundleVersion）を決める。App Store Connect の全ビルド（iOS・macOS・visionOS の全バージョン）の
  # いちばん大きいビルド番号 + 1 を、3 つのプラットフォームの archive に渡す（.github/scripts/next-build-number.rb）。
  # Xcode の自動採番は新しいバージョンでは archive の番号から数え直し、macOS はバージョンをまたいでも前のビルドより
  # 大きくないとアップロードできないため、xcconfig の CURRENT_PROJECT_VERSION のままだとバージョンを上げたときに止まる（LEARNINGS.md）。
  # 番号は run の最初に 1 回だけ決める。前の run は終わっているので（concurrency）、その run の iOS のビルドは数分前に上がっていて数えられる。
  # macOS のランナーを使わないよう ubuntu で行う
  build-number:
    if: vars.ENABLE_DELIVERY != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      value: ${{ steps.next.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create API private key
        # Secrets はシェル展開ではなく env 経由で渡す。鍵はリポジトリ配下ではなく RUNNER_TEMP に置く
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Decide build number
        id: next
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey.p8
        run: |
          set -euo pipefail
          # CURRENT_PROJECT_VERSION は下限にする（手で起点を上げたいときは xcconfig の値を上げる）
          minimum=$(sed -n 's/^CURRENT_PROJECT_VERSION *= *\([^ ;/]*\).*/\1/p' Configs/Project.xcconfig | head -1)
          BUNDLE_ID=$(python3 Tools/app_store_config.py bundle-id) \
          MINIMUM_BUILD_NUMBER="$minimum" \
            ruby .github/scripts/next-build-number.rb

  # iOS → macOS → visionOS の順に 1 つずつ流す。macOS ランナーの同時実行枠（Organization 全体で 5）を 1 つしか使わないため。
  # 前のプラットフォームが失敗しても次は流す（!cancelled()）。
  # App Store Connect のアプリに macOS・visionOS のプラットフォームが無いうちは、_archive.yml が確かめて archive を飛ばす（失敗にしない）
  upload:
    # テンプレートリポジトリ自身など、App Store Connect にアプリが無いリポジトリではリポジトリ変数 ENABLE_DELIVERY=false でスキップする。
    # Archive（手動実行で Export まで確認する）はアプリが無くても通るので止めない。
    # build-number が失敗したら、どのプラットフォームも上げない（xcconfig の番号で上げると macOS が止まるため）
    needs: build-number
    if: vars.ENABLE_DELIVERY != 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/_archive.yml
    with:
      platform: iOS
      upload: true
      build-number: ${{ needs.build-number.outputs.value }}
    secrets: inherit

  upload-macos:
    # macOS だけを止めたいときはリポジトリ変数 ENABLE_MACOS_DELIVERY=false にする
    needs: [build-number, upload]
    if: ${{ !cancelled() && needs.build-number.result == 'success' && vars.ENABLE_DELIVERY != 'false' && vars.ENABLE_MACOS_DELIVERY != 'false' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_archive.yml
    with:
      platform: macOS
      upload: true
      build-number: ${{ needs.build-number.outputs.value }}
    secrets: inherit

  upload-visionos:
    # visionOS だけを止めたいときはリポジトリ変数 ENABLE_VISIONOS_DELIVERY=false にする
    needs: [build-number, upload-macos]
    if: ${{ !cancelled() && needs.build-number.result == 'success' && vars.ENABLE_DELIVERY != 'false' && vars.ENABLE_VISIONOS_DELIVERY != 'false' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_archive.yml
    with:
      platform: visionOS
      upload: true
      build-number: ${{ needs.build-number.outputs.value }}
    secrets: inherit
