name: Archive

# Archive → Export（iOS・visionOS は IPA、macOS は pkg）まで通ることを確認する（アップロードはしない）。手動実行のみ。
# main への push では Build だけを実行する（main には develop / release/** で Upload を通したものがマージされるため）。
# develop / release/** は upload.yml が Archive を含む。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # iOS → macOS → visionOS の順に 1 つずつ流す。macOS ランナーの同時実行枠（Organization 全体で 5）を 1 つしか使わないため。
  # 前のプラットフォームが失敗しても次は流す（!cancelled()）。macOS・visionOS だけを止めたいときは
  # リポジトリ変数 ENABLE_MACOS_DELIVERY / ENABLE_VISIONOS_DELIVERY を false にする（Upload と同じ）
  archive:
    permissions:
      contents: read
    uses: ./.github/workflows/_archive.yml
    with:
      platform: iOS
      upload: false
    secrets: inherit

  archive-macos:
    needs: archive
    if: ${{ !cancelled() && vars.ENABLE_MACOS_DELIVERY != 'false' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_archive.yml
    with:
      platform: macOS
      upload: false
    secrets: inherit

  archive-visionos:
    needs: archive-macos
    if: ${{ !cancelled() && vars.ENABLE_VISIONOS_DELIVERY != 'false' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_archive.yml
    with:
      platform: visionOS
      upload: false
    secrets: inherit
